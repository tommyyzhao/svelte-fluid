name: Release

on:
  push:
    branches: [main]

# One release attempt at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# id-token: write enables npm Trusted Publishing via GitHub OIDC.
# contents: write lets the action push the Version PR + tags.
# pull-requests: write lets it open the Version PR.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  browser:
    name: Browser tests (Chromium, shard ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p browser-test-results
          bun run test:browser -- --shard=${{ matrix.shard }}/3 2>&1 | tee browser-test-results/vitest-browser.log

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-test-failure-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            browser-test-results/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Version PR or publish
    needs: browser
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changesets needs full history to detect changesets across commits.
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node (for npm Trusted Publishing)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify npm Trusted Publishing toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # needs: browser keeps publishing behind every real-WebGL shard in this
      # workflow. Relying on the independent CI workflow alone can race a publish
      # against a browser-test failure. verify:release remains the local gate.
      - name: Verify release candidate
        run: bun run test && bun run check && bun run build

      # If `.changeset/*.md` files exist, opens a "Version Packages" PR.
      # When that PR is merged (no remaining changesets), runs `publish`.
      - name: Create Release PR or publish (changesets)
        uses: changesets/action@v1
        with:
          version: bun run changeset version
          publish: bun run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted Publishing writes a verified-build attestation to npm.
          NPM_CONFIG_PROVENANCE: 'true'
          # prepublishOnly skips the browser suite: every shard above already passed.
          RELEASE_BROWSER_VERIFIED: '1'
