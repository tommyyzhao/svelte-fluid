<!doctype html>
<meta charset="utf-8">
<title>ADR-0088 Chrome transferred WebGL bitmap context-loss repro</title>
<canvas width="8" height="8"></canvas>
<pre id="status"></pre>
<script type="module">
// Diagnostic only, deliberately outside the library and normal test suite.
// Open in hardware Chrome; ?snapshot uses the passing createImageBitmap path.
// ?close clears the bitmaprenderer before loss (a diagnostic, NOT a fix).
// Observed 2026-10-02: Chrome 154.0.8037.95, macOS 27, ANGLE Metal Apple M1 Max.
// Transfer path intermittently loses the renderer/page; snapshot path survived
// 28 isolated runs, then the host browser suite including all 24-instance loss
// and restore checks. This is evidence for this environment, not all browsers.
const params = new URL(location.href).searchParams;
const status = document.querySelector('#status');
const log = (message) => { status.textContent += message + '\n'; console.log(message); };
const canvas = document.querySelector('canvas');
const surface = new OffscreenCanvas(8, 8);
const gl = surface.getContext('webgl2');
const quad = gl.createVertexArray();
gl.bindVertexArray(quad);
const vertices = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vertices);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.enableVertexAttribArray(0);
const indices = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indices);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
const vs = gl.createShader(gl.VERTEX_SHADER);
gl.shaderSource(vs, '#version 300 es\nlayout(location=0) in vec2 a; void main(){gl_Position=vec4(a,0,1);}');
gl.compileShader(vs);
const fs = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(fs, '#version 300 es\nprecision highp float; out vec4 c; void main(){c=vec4(1);}');
gl.compileShader(fs);
const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
gl.useProgram(program);
gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
const snapshot = params.has('snapshot');
canvas.getContext('bitmaprenderer').transferFromImageBitmap(
	snapshot ? await createImageBitmap(surface) : surface.transferToImageBitmap()
);
log(snapshot ? 'createImageBitmap presented' : 'transferToImageBitmap presented');
if (new URL(location.href).searchParams.has('close')) canvas.getContext('bitmaprenderer').transferFromImageBitmap(null);
const lose = gl.getExtension('WEBGL_lose_context');
const lost = new Promise((resolve) => surface.addEventListener('webglcontextlost', (event) => {
	event.preventDefault();
	log('lost');
	resolve();
}, { once: true }));
lose.loseContext();
await lost;
await new Promise((r) => setTimeout(r, 0));
const restored = new Promise((resolve) => surface.addEventListener('webglcontextrestored', () => {
	log('restored');
	resolve();
}, { once: true }));
lose.restoreContext();
await restored;
await new Promise((r) => setTimeout(r, 300));
// Keep the first bitmap displayed through loss/restore, then explicitly release.
canvas.getContext('bitmaprenderer').transferFromImageBitmap(null);
canvas.remove();
log('released');
// Bounded mount churn; ?mixed adds 24 differently sized visible bitmap canvases
// sharing this diagnostic surface. Never part of production or normal tests.
for (let mount = 0; mount < Number(params.get('churn') || 0); mount++) {
	const source = new OffscreenCanvas(8, 8);
	const context = source.getContext('webgl2');
	context.clearColor(0.1, 0.2, 0.3, 0.5);
	context.clear(context.COLOR_BUFFER_BIT);
	const targets = [];
	for (let i = 0; i < (params.has('mixed') ? 24 : 1); i++) {
		source.width = 8 + i % 3 * 5; source.height = 8 + i % 4 * 3;
		context.clear(context.COLOR_BUFFER_BIT);
		const target = document.createElement('canvas');
		target.width = source.width; target.height = source.height; document.body.append(target);
		const bitmap = snapshot ? await createImageBitmap(source, { colorSpaceConversion: 'none' }) : source.transferToImageBitmap();
		target.getContext('bitmaprenderer').transferFromImageBitmap(bitmap); bitmap.close(); targets.push(target);
	}
	const extension = context.getExtension('WEBGL_lose_context');
	const lost = new Promise((resolve) => source.addEventListener('webglcontextlost', (event) => { event.preventDefault(); resolve(); }, { once: true }));
	extension.loseContext(); await lost;
	await new Promise((r) => setTimeout(r, 0));
	const restored = new Promise((resolve) => source.addEventListener('webglcontextrestored', resolve, { once: true }));
	extension.restoreContext(); await restored;
	for (const target of targets) { target.getContext('bitmaprenderer').transferFromImageBitmap(null); target.remove(); }
	extension.loseContext();
	await new Promise((r) => setTimeout(r, 0));
}
log('completed');
</script>
