<!doctype html>
<meta charset="utf-8">
<title>ADR-0088 bitmap context-loss diagnostic</title>
<pre id="status"></pre>
<script type="module">
// Diagnostic only. No production transport changes. Console survives page crashes.
const params = new URL(location.href).searchParams;
const mode = params.get('mode') || (params.has('snapshot') ? 'snapshot' : 'transfer');
const boundary = params.get('boundary') || 'aftervisible';
const status = document.querySelector('#status');
const mark = (phase) => { console.log(phase); status.textContent += phase + '\n'; };
const task = () => new Promise((resolve) => setTimeout(resolve, 0));
const visible = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
const equal = (actual, expected, label) => {
	if (actual.length !== expected.length || actual.some((value, i) => value !== expected[i])) throw new Error(`pixel mismatch: ${label}; actual=${Array.from(actual.slice(0, 4))}; expected=${Array.from(expected.slice(0, 4))}`);
	mark(`pixels:${label}:exact`);
};
const pixels = (target) => {
	const copy = new OffscreenCanvas(target.width, target.height);
	const context = copy.getContext('2d', { alpha: true, colorSpace: 'srgb' });
	context.drawImage(target, 0, 0);
	const data = context.getImageData(0, 0, copy.width, copy.height).data;
	copy.width = 1;
	return data;
};
async function mount(round, count) {
	const prefix = `mount:${round}`;
	const phase = (value) => mark(`${prefix}:${value}`);
	const source = new OffscreenCanvas(8, 8);
	const gl = source.getContext('webgl2');
	if (!gl) throw new Error('WebGL2 unavailable');
	const extension = gl.getExtension('WEBGL_lose_context');
	if (!extension) throw new Error('WEBGL_lose_context unavailable');
	let resolveLost;
	const lost = new Promise((resolve) => { resolveLost = resolve; });
	source.addEventListener('webglcontextlost', (event) => { event.preventDefault(); phase('event:lost'); resolveLost(); }, { once: true });
	const lose = () => { phase('lose:before'); extension.loseContext(); phase('lose:after'); };
	const targets = [];
	for (let i = 0; i < count; i++) {
		phase(`target:${i}:resize:before`);
		source.width = 8 + i % 3 * 5; source.height = 8 + i % 4 * 3;
		gl.clearColor(0.25, 0.5, 0.75, i % 2 ? 0.5 : 1);
		gl.clear(gl.COLOR_BUFFER_BIT);
		phase(`target:${i}:resize:after`);
		const target = document.createElement('canvas');
		target.width = source.width; target.height = source.height; document.body.append(target);
		const context = target.getContext(mode === 'transfer2d' ? '2d' : 'bitmaprenderer', { alpha: true, colorSpace: 'srgb' });
		if (!context) throw new Error('destination context unavailable');
		// Safe reference is CPU pixels, never a retained bitmaprenderer backing.
		phase(`target:${i}:reference:before`);
		const reference = await createImageBitmap(source, { colorSpaceConversion: 'none' });
		const expected = pixels(reference);
		if (mode !== 'transfer-close-only') {
			if (mode === 'transfer2d') { context.globalCompositeOperation = 'copy'; context.drawImage(reference, 0, 0); }
			else context.transferFromImageBitmap(reference);
			equal(pixels(target), expected, `${prefix}:target:${i}:previous-frame`);
		}
		reference.close();
		phase(`target:${i}:reference:after`);
		phase(`target:${i}:bitmap:before`);
		const bitmap = mode === 'snapshot' ? await createImageBitmap(source, { colorSpaceConversion: 'none' }) : source.transferToImageBitmap();
		phase(`target:${i}:bitmap:after`);
		try {
			if (i === count - 1 && boundary === 'aftertransfer') {
				lose();
				if (mode !== 'transfer-close-only') equal(pixels(target), expected, `${prefix}:target:${i}:previous-frame-after-loss`);
			}
			if (mode !== 'transfer-close-only') {
				phase(`target:${i}:draw:before`);
				if (mode === 'transfer2d') { context.globalCompositeOperation = 'copy'; context.drawImage(bitmap, 0, 0); }
				else context.transferFromImageBitmap(bitmap);
				phase(`target:${i}:draw:after`);
			}
			if (i === count - 1 && boundary === 'afterdraw') lose();
		} finally {
			phase(`target:${i}:close:before`); bitmap.close(); phase(`target:${i}:close:after`);
		}
		if (i === count - 1 && boundary === 'afterclose') lose();
		if (mode !== 'transfer-close-only') equal(pixels(target), expected, `${prefix}:target:${i}:draw`);
		targets.push({ target, context, expected });
	}
	if (boundary === 'nexttask') { phase('nexttask:before'); await task(); phase('nexttask:after'); lose(); }
	if (boundary === 'aftervisible') { phase('compositor:before'); await visible(); phase('compositor:after'); lose(); }
	const verify = (label) => {
		if (mode !== 'transfer-close-only') for (const { target, expected } of targets) equal(pixels(target), expected, `${prefix}:${label}`);
	};
	// Check retained pixels before waiting for notification; no early retirement.
	verify('loss-call');
	phase('loss-wait:before'); await lost; phase('loss-wait:after');
	verify('lost');
	await task();
	const restored = new Promise((resolve) => source.addEventListener('webglcontextrestored', () => { phase('event:restored'); resolve(); }, { once: true }));
	phase('restore:before'); extension.restoreContext(); phase('restore:after');
	await restored; verify('restored');
	phase('source-reuse:before');
	source.width = 19; source.height = 11;
	gl.clearColor(1, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
	phase('source-reuse:after'); verify('source-reuse');
	await visible(); verify('idle-frame');
	phase('final-host-release:before'); extension.loseContext(); phase('final-host-release:after');
	await task(); await visible(); verify('final-host-release');
	for (const { target, context } of targets) {
		phase('retire:before');
		if (mode !== 'transfer2d') context.transferFromImageBitmap(null);
		else target.width = 1;
		target.remove(); phase('retire:after');
	}
	phase('completed');
}
mark(`mode:${mode}:boundary:${boundary}`);
await mount(0, params.has('mixed') ? 24 : 1);
for (let round = 1; round <= Number(params.get('churn') || 0); round++) await mount(round, params.has('mixed') ? 24 : 1);
mark('completed');
</script>
